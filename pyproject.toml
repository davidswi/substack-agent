[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "substack-agent"
version = "0.1.0"
description = "CLI tool to ingest Substack content and query it via a Haiku RAG backend using LM Studio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
substack-agent = "substack_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
